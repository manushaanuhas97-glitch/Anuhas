<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal QR Code Studio | Anuhas Tools</title>
  <meta name="description" content="Generate custom QR Codes for URLs, Text, Wi-Fi, Phone numbers with custom colors and HD download." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .qr-studio-wrap { max-width: 840px; margin: 0 auto; padding: 28px 24px 60px; position: relative; z-index: 1; }
    .qr-head { text-align: center; margin-bottom: 32px; }
    .qr-head h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 6px; }
    .qr-head p  { color: var(--text-secondary); }

    .qr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    @media(max-width:768px){ .qr-grid { grid-template-columns: 1fr; } }

    .qr-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px; }
    .qr-panel-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }

    /* Type Selector Tabs */
    .qr-type-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .type-tab { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-family: inherit; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: var(--transition-fast); }
    .type-tab.active { background: var(--purple); border-color: transparent; color: white; }

    .qr-field-group { margin-bottom: 18px; text-align: left; }
    .qr-field-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .qr-field-group input, .qr-field-group textarea, .qr-field-group select { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; color: var(--text-primary); font-family: inherit; font-size: 0.95rem; outline: none; transition: var(--transition-smooth); }
    .qr-field-group input:focus, .qr-field-group textarea:focus { border-color: var(--purple-light); box-shadow: 0 0 0 3px var(--purple-glow); }

    .color-pickers-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .color-pick-box { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; }
    .color-pick-box label { font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); }
    .color-pick-box input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: none; }

    /* Preview Card */
    .qr-preview-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .qr-display-card {
      width: 240px; height: 240px;
      background: white; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      padding: 18px; box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      margin-bottom: 24px; transition: transform 0.3s ease;
    }
    .qr-display-card:hover { transform: scale(1.03); }
    .qr-img { max-width: 100%; max-height: 100%; display: block; }

    .btn-download { width: 100%; background: linear-gradient(135deg, var(--purple), var(--cyan)); border: none; border-radius: var(--radius-md); padding: 14px; color: white; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; transition: var(--transition-smooth); box-shadow: 0 4px 20px var(--purple-glow); text-decoration: none; text-align: center; display: block; }
    .btn-download:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--purple-glow); }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <nav class="tool-nav">
    <a href="../../index.html">🛠️ Anuhas Tools</a>
    <span class="tool-nav-sep">›</span>
    <span class="tool-nav-title">⚡ Universal QR Studio</span>
  </nav>

  <div class="qr-studio-wrap">
    <div class="qr-head">
      <h1>⚡ Universal QR Code Studio</h1>
      <p>ඕනෑම කෙනෙකුට තමන්ගේම Website Link, Text, Phone number හෝ Wi-Fi සදහා QR Codes සාදා ගැනීමට හැක</p>
    </div>

    <div class="qr-grid">
      <!-- Input Panel -->
      <div class="qr-panel">
        <h2 class="qr-panel-title">✏️ QR Content & Style</h2>

        <!-- Tabs -->
        <div class="qr-type-tabs">
          <button class="type-tab active" onclick="setType('url', this)">🔗 Link / URL</button>
          <button class="type-tab" onclick="setType('text', this)">📝 Text / Note</button>
          <button class="type-tab" onclick="setType('phone', this)">📞 Phone</button>
          <button class="type-tab" onclick="setType('wifi', this)">📶 Wi-Fi</button>
        </div>

        <!-- Dynamic Inputs -->
        <div id="dynamicInputs">
          <div class="qr-field-group">
            <label for="urlInput">Enter Website / Link</label>
            <input type="text" id="urlInput" value="https://tinyurl.com/anuhas-lk" placeholder="https://example.com" oninput="updateQR()" />
          </div>
        </div>

        <!-- Custom Styling -->
        <div class="color-pickers-row">
          <div class="color-pick-box">
            <label>QR Color</label>
            <input type="color" id="qrFgColor" value="#050711" onchange="updateQR()" />
          </div>
          <div class="color-pick-box">
            <label>Background</label>
            <input type="color" id="qrBgColor" value="#ffffff" onchange="updateQR()" />
          </div>
        </div>

        <div class="qr-field-group">
          <label for="qrSize">Image Quality / Resolution</label>
          <select id="qrSize" onchange="updateQR()">
            <option value="300x300" selected>300 x 300 (Standard)</option>
            <option value="500x500">500 x 500 (HD High Quality)</option>
            <option value="800x800">800 x 800 (Ultra HD Print)</option>
          </select>
        </div>
      </div>

      <!-- Preview & Download Panel -->
      <div class="qr-panel qr-preview-panel">
        <h2 class="qr-panel-title">📸 QR Code Preview</h2>
        <div class="qr-display-card" id="cardBg">
          <img id="qrImg" class="qr-img" src="" alt="QR Code Preview" />
        </div>
        <a id="downloadBtn" download="my-custom-qr.png" class="btn-download" href="#" target="_blank">📥 Download HD QR Code</a>
      </div>
    </div>
  </div>

  <script>
    let currentType = 'url';

    function setType(type, btn) {
      currentType = type;
      document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');

      const container = document.getElementById('dynamicInputs');
      if (type === 'url') {
        container.innerHTML = `
          <div class="qr-field-group">
            <label for="urlInput">Enter Website URL or Social Link</label>
            <input type="text" id="urlInput" value="https://tinyurl.com/anuhas-lk" placeholder="https://yourwebsite.com" oninput="updateQR()" />
          </div>`;
      } else if (type === 'text') {
        container.innerHTML = `
          <div class="qr-field-group">
            <label for="textInput">Enter Any Text or Message</label>
            <textarea id="textInput" rows="3" placeholder="Type message here..." oninput="updateQR()">Hello from Anuhas Tools!</textarea>
          </div>`;
      } else if (type === 'phone') {
        container.innerHTML = `
          <div class="qr-field-group">
            <label for="phoneInput">Enter Phone Number</label>
            <input type="text" id="phoneInput" value="0760870140" placeholder="076..." oninput="updateQR()" />
          </div>`;
      } else if (type === 'wifi') {
        container.innerHTML = `
          <div class="qr-field-group">
            <label for="wifiSsid">Wi-Fi Name (SSID)</label>
            <input type="text" id="wifiSsid" placeholder="My Home WiFi" oninput="updateQR()" />
          </div>
          <div class="qr-field-group">
            <label for="wifiPass">Wi-Fi Password</label>
            <input type="password" id="wifiPass" placeholder="Password" oninput="updateQR()" />
          </div>`;
      }
      updateQR();
    }

    function updateQR() {
      let content = '';
      if (currentType === 'url') {
        content = document.getElementById('urlInput')?.value.trim() || 'https://tinyurl.com/anuhas-lk';
      } else if (currentType === 'text') {
        content = document.getElementById('textInput')?.value.trim() || 'Hello!';
      } else if (currentType === 'phone') {
        const num = document.getElementById('phoneInput')?.value.trim() || '0760870140';
        content = `tel:${num}`;
      } else if (currentType === 'wifi') {
        const ssid = document.getElementById('wifiSsid')?.value.trim() || '';
        const pass = document.getElementById('wifiPass')?.value.trim() || '';
        content = `WIFI:S:${ssid};T:WPA;P:${pass};;`;
      }

      const fg = document.getElementById('qrFgColor').value.substring(1);
      const bg = document.getElementById('qrBgColor').value.substring(1);
      const size = document.getElementById('qrSize').value;

      document.getElementById('cardBg').style.backgroundColor = '#' + bg;

      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}&data=${encodeURIComponent(content)}&color=${fg}&bgcolor=${bg}`;

      const img = document.getElementById('qrImg');
      img.src = qrApiUrl;

      const downloadBtn = document.getElementById('downloadBtn');
      downloadBtn.href = qrApiUrl;
    }

    updateQR();
  </script>
</body>
</html>
