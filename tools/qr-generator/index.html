<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator | Anuhas Tools</title>
  <meta name="description" content="Generate instant QR Codes for URLs, Text, Wi-Fi & Contact info" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .qr-wrap { max-width: 640px; margin: 0 auto; padding: 28px 24px 60px; position: relative; z-index: 1; }
    .qr-head { text-align: center; margin-bottom: 32px; }
    .qr-head h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 6px; }
    .qr-head p  { color: var(--text-secondary); }

    .qr-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; text-align: center; }

    .qr-input-group { text-align: left; margin-bottom: 24px; }
    .qr-input-group label { display: block; font-size: 0.88rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
    .qr-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 18px; color: var(--text-primary); font-family: inherit; font-size: 1rem; outline: none; transition: var(--transition-smooth); }
    .qr-input:focus { border-color: var(--purple-light); box-shadow: 0 0 0 3px var(--purple-glow); }

    .qr-preview-card {
      width: 220px; height: 220px; margin: 0 auto 24px;
      background: white; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      position: relative;
    }
    .qr-img { max-width: 100%; max-height: 100%; display: block; }

    .btn-download-qr {
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      border: none; border-radius: var(--radius-md); padding: 14px 28px;
      color: white; font-family: inherit; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: var(--transition-smooth);
      box-shadow: 0 4px 20px var(--purple-glow);
      text-decoration: none; display: inline-block;
    }
    .btn-download-qr:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--purple-glow); }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <nav class="tool-nav">
    <a href="../../index.html">🛠️ Anuhas Tools</a>
    <span class="tool-nav-sep">›</span>
    <span class="tool-nav-title">⚡ QR Code Generator</span>
  </nav>

  <div class="qr-wrap">
    <div class="qr-head">
      <h1>⚡ Instant QR Code Generator</h1>
      <p>Convert any Link or Text into a downloadable QR code instantly</p>
    </div>

    <div class="qr-panel">
      <div class="qr-input-group">
        <label for="qrTextInput">Enter Website URL or Text</label>
        <input type="text" id="qrTextInput" class="qr-input" value="https://tinyurl.com/anuhas-lk" placeholder="https://..." oninput="generateQR()" />
      </div>

      <div class="qr-preview-card">
        <img id="qrImg" class="qr-img" src="" alt="QR Code Preview" />
      </div>

      <a id="downloadBtn" download="anuhas-qr-code.png" class="btn-download-qr" href="#" target="_blank">📥 Download QR Code</a>
    </div>
  </div>

  <script>
    function generateQR() {
      const val = document.getElementById('qrTextInput').value.trim() || 'https://tinyurl.com/anuhas-lk';
      const encoded = encodeURIComponent(val);
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encoded}&color=050711&bgcolor=ffffff`;
      
      const img = document.getElementById('qrImg');
      img.src = qrUrl;

      const btn = document.getElementById('downloadBtn');
      btn.href = qrUrl;
    }

    generateQR();
  </script>
</body>
</html>
