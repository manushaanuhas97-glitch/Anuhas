<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator | Anuhas Tools</title>
  <meta name="description" content="Generate strong, uncrackable passwords instantly" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .pg-wrap { max-width: 600px; margin: 0 auto; padding: 28px 24px 60px; position: relative; z-index: 1; }
    .pg-head { text-align: center; margin-bottom: 32px; }
    .pg-head h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 6px; }
    .pg-head p  { color: var(--text-secondary); }

    .pg-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; }

    /* Output display */
    .pg-output-box {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(0,0,0,0.4); border: 1px solid var(--border-bright);
      border-radius: var(--radius-md); padding: 16px 20px; margin-bottom: 24px;
    }
    .pg-pass-text { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; font-weight: 700; color: var(--green); word-break: break-all; }
    .btn-copy-pass { background: linear-gradient(135deg, var(--purple), var(--cyan)); border: none; border-radius: var(--radius-sm); padding: 10px 18px; color: white; font-family: inherit; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: var(--transition-fast); white-space: nowrap; margin-left: 12px; }
    .btn-copy-pass:hover { transform: scale(1.04); }

    /* Controls */
    .pg-control-g { margin-bottom: 20px; }
    .pg-label-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
    .pg-range { width: 100%; accent-color: var(--purple-light); cursor: pointer; }

    .pg-checkboxes { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
    .chk-row { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.95rem; color: var(--text-secondary); }
    .chk-row input { width: 18px; height: 18px; accent-color: var(--purple); cursor: pointer; }

    .btn-generate { width: 100%; background: linear-gradient(135deg, var(--purple), var(--pink)); border: none; border-radius: var(--radius-md); padding: 16px; color: white; font-family: inherit; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: var(--transition-smooth); box-shadow: 0 4px 24px var(--purple-glow); }
    .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 8px 32px var(--purple-glow); }

    .toast { position: fixed; bottom: 30px; right: 30px; background: rgba(15,23,42,0.9); border: 1px solid var(--border-bright); backdrop-filter: blur(16px); padding: 12px 24px; border-radius: var(--radius-sm); font-weight: 600; transform: translateY(60px); opacity: 0; transition: all 0.3s ease; pointer-events: none; z-index: 999; }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <nav class="tool-nav">
    <a href="../../index.html">🛠️ Anuhas Tools</a>
    <span class="tool-nav-sep">›</span>
    <span class="tool-nav-title">🔐 Password Generator</span>
  </nav>

  <div class="pg-wrap">
    <div class="pg-head">
      <h1>🔐 Strong Password Generator</h1>
      <p>Create uncrackable, highly secure passwords instantly</p>
    </div>

    <div class="pg-panel">
      <!-- Output box -->
      <div class="pg-output-box">
        <span class="pg-pass-text" id="passOutput">Select options below</span>
        <button class="btn-copy-pass" onclick="copyPassword()">Copy 📋</button>
      </div>

      <!-- Controls -->
      <div class="pg-control-g">
        <div class="pg-label-row">
          <span>Password Length</span>
          <span id="lengthVal" style="color:var(--purple-light);">16</span>
        </div>
        <input type="range" id="lengthRange" class="pg-range" min="6" max="64" value="16" oninput="document.getElementById('lengthVal').textContent=this.value; generatePass();" />
      </div>

      <div class="pg-checkboxes">
        <label class="chk-row">
          <input type="checkbox" id="chkUpper" checked onchange="generatePass()" />
          <span>Include Uppercase Letters (A-Z)</span>
        </label>
        <label class="chk-row">
          <input type="checkbox" id="chkLower" checked onchange="generatePass()" />
          <span>Include Lowercase Letters (a-z)</span>
        </label>
        <label class="chk-row">
          <input type="checkbox" id="chkNum" checked onchange="generatePass()" />
          <span>Include Numbers (0-9)</span>
        </label>
        <label class="chk-row">
          <input type="checkbox" id="chkSym" checked onchange="generatePass()" />
          <span>Include Special Symbols (!@#$%^&*)</span>
        </label>
      </div>

      <button class="btn-generate" onclick="generatePass()">⚡ Generate New Password</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function generatePass() {
      const len = parseInt(document.getElementById('lengthRange').value);
      const upper = document.getElementById('chkUpper').checked;
      const lower = document.getElementById('chkLower').checked;
      const num   = document.getElementById('chkNum').checked;
      const sym   = document.getElementById('chkSym').checked;

      let chars = '';
      if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (lower) chars += 'abcdefghijklmnopqrstuvwxyz';
      if (num)   chars += '0123456789';
      if (sym)   chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

      if (!chars) {
        document.getElementById('passOutput').textContent = 'Select at least 1 option!';
        document.getElementById('passOutput').style.color = '#ef4444';
        return;
      }
      document.getElementById('passOutput').style.color = 'var(--green)';

      let res = '';
      const cryptoObj = window.crypto || window.msCrypto;
      const randomValues = new Uint32Array(len);
      cryptoObj.getRandomValues(randomValues);

      for (let i = 0; i < len; i++) {
        res += chars[randomValues[i] % chars.length];
      }

      document.getElementById('passOutput').textContent = res;
    }

    function copyPassword() {
      const txt = document.getElementById('passOutput').textContent;
      if (!txt || txt.includes('Select')) return;
      navigator.clipboard.writeText(txt);
      const toast = document.getElementById('toast');
      toast.textContent = 'Password copied to clipboard! 🔒';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    generatePass();
  </script>
</body>
</html>
