<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stopwatch & Timer | Anuhas Tools</title>
  <meta name="description" content="Precision stopwatch and countdown timer with lap tracking" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .sw-wrap { max-width: 640px; margin: 0 auto; padding: 28px 24px 60px; position: relative; z-index: 1; }
    .sw-head { text-align: center; margin-bottom: 28px; }
    .sw-head h1 { font-size: 2rem; font-weight: 800; margin-bottom: 6px; }
    .sw-head p  { color: var(--text-2); }

    .sw-tabs { display: flex; background: rgba(0,0,0,.3); border-radius: 12px; padding: 4px; margin-bottom: 24px; gap: 4px; }
    .sw-tab  { flex:1; padding: 11px; border: none; border-radius: 9px; background: transparent; color: var(--text-2); font-family: 'Outfit',sans-serif; font-size: .95rem; font-weight: 700; cursor: pointer; transition: var(--tr); }
    .sw-tab.active { background: linear-gradient(135deg,var(--purple),var(--cyan)); color: #fff; box-shadow: 0 4px 16px rgba(139,92,246,.4); }

    .sw-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 36px; text-align: center; }

    /* Clock face */
    .clock-face {
      width: 240px; height: 240px; margin: 0 auto 28px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,.12) 0%, rgba(6,182,212,.05) 100%);
      border: 3px solid rgba(139,92,246,.3);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      box-shadow: 0 0 60px rgba(139,92,246,.2), inset 0 0 40px rgba(0,0,0,.3);
    }
    .clock-face::before {
      content:''; position: absolute; inset: 8px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.06);
    }
    .clock-ring {
      position: absolute; inset: -4px; border-radius: 50%;
      background: conic-gradient(var(--purple) var(--prog, 0%), transparent var(--prog, 0%));
      opacity: 0;
      transition: opacity .3s ease;
      mask: radial-gradient(circle, transparent 50%, black 51%);
      -webkit-mask: radial-gradient(circle, transparent 50%, black 51%);
    }
    .clock-ring.active { opacity: 1; }

    .time-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.6rem; font-weight: 700;
      color: var(--text);
      letter-spacing: 2px;
      line-height: 1;
    }
    .time-ms { font-size: 1.2rem; color: var(--purple-l); }

    /* Controls */
    .sw-controls { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
    .ctrl-btn {
      width: 64px; height: 64px; border-radius: 50%;
      border: none; cursor: pointer; font-size: 1.5rem;
      transition: var(--tr); display: flex; align-items: center; justify-content: center;
    }
    .ctrl-btn:hover { transform: scale(1.1); }
    .ctrl-btn.start  { background: linear-gradient(135deg,var(--green),#059669); box-shadow: 0 4px 20px rgba(16,185,129,.5); }
    .ctrl-btn.pause  { background: linear-gradient(135deg,var(--amber),#d97706); box-shadow: 0 4px 20px rgba(245,158,11,.5); }
    .ctrl-btn.reset  { background: rgba(255,255,255,.08); border: 1px solid var(--border); }
    .ctrl-btn.lap    { background: linear-gradient(135deg,var(--purple),var(--blue)); box-shadow: 0 4px 20px rgba(139,92,246,.4); }
    .ctrl-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }

    /* Timer input */
    .timer-inputs { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 20px; }
    .time-inp {
      width: 72px; text-align: center;
      background: rgba(0,0,0,.3); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: 'JetBrains Mono',monospace; font-size: 1.5rem; font-weight: 700;
      padding: 10px; outline: none; transition: var(--tr);
    }
    .time-inp:focus { border-color: rgba(139,92,246,.6); }
    .time-sep { font-size: 1.8rem; font-weight: 800; color: var(--purple-l); }

    /* Timer progress */
    .timer-progress { width: 100%; height: 8px; background: rgba(255,255,255,.07); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
    .timer-prog-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg,var(--green),var(--cyan)); width: 100%; transition: width .2s linear; }

    /* Laps */
    .laps-list { max-height: 220px; overflow-y: auto; margin-top: 16px; display: flex; flex-direction: column; gap: 7px; }
    .lap-item { display: flex; justify-content: space-between; background: rgba(0,0,0,.2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px; font-family: 'JetBrains Mono',monospace; font-size: .88rem; }
    .lap-num  { color: var(--text-3); }
    .lap-time { color: var(--text); font-weight: 700; }
    .lap-diff { color: var(--purple-l); }
    .lap-best { color: var(--green); }
    .lap-worst{ color: #ef4444; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <nav class="tool-nav">
    <a href="../../index.html">🛠️ Anuhas Tools</a>
    <span class="tool-nav-sep">›</span>
    <span class="tool-nav-title">⏱️ Stopwatch & Timer</span>
  </nav>

  <div class="sw-wrap">
    <div class="sw-head">
      <h1>⏱️ Stopwatch & Timer</h1>
      <p>Precision timing with lap tracking</p>
    </div>

    <div class="sw-tabs">
      <button class="sw-tab active" id="tabSW" onclick="setMode('stopwatch')">⏱️ Stopwatch</button>
      <button class="sw-tab" id="tabTM" onclick="setMode('timer')">⏲️ Countdown Timer</button>
    </div>

    <!-- STOPWATCH -->
    <div id="stopwatchPanel" class="sw-panel">
      <div class="clock-face">
        <div class="clock-ring" id="swRing"></div>
        <div>
          <div class="time-display" id="swDisplay">00:00<span class="time-ms">.00</span></div>
        </div>
      </div>
      <div class="sw-controls">
        <button class="ctrl-btn reset"  id="swReset"  onclick="swReset()" title="Reset">🔄</button>
        <button class="ctrl-btn start"  id="swStart"  onclick="swStartPause()" title="Start">▶️</button>
        <button class="ctrl-btn lap"    id="swLap"    onclick="swLap()" disabled title="Lap">🏁</button>
      </div>
      <div class="laps-list" id="lapsList"></div>
    </div>

    <!-- TIMER -->
    <div id="timerPanel" class="sw-panel hidden">
      <div class="timer-inputs" id="timerInputs">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
          <span style="font-size:.75rem;color:var(--text-3)">HH</span>
          <input class="time-inp" type="number" id="tmH" min="0" max="99" value="0" placeholder="00" />
        </div>
        <span class="time-sep">:</span>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
          <span style="font-size:.75rem;color:var(--text-3)">MM</span>
          <input class="time-inp" type="number" id="tmM" min="0" max="59" value="5" placeholder="00" />
        </div>
        <span class="time-sep">:</span>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
          <span style="font-size:.75rem;color:var(--text-3)">SS</span>
          <input class="time-inp" type="number" id="tmS" min="0" max="59" value="0" placeholder="00" />
        </div>
      </div>
      <div class="clock-face" style="margin-bottom:16px">
        <div class="clock-ring" id="tmRing"></div>
        <div class="time-display" id="tmDisplay" style="display:none">00:05<span class="time-ms">.00</span></div>
      </div>
      <div class="timer-progress hidden" id="timerProgressWrap">
        <div class="timer-prog-fill" id="timerProgFill"></div>
      </div>
      <div class="sw-controls">
        <button class="ctrl-btn reset"  id="tmReset" onclick="tmReset()" title="Reset">🔄</button>
        <button class="ctrl-btn start"  id="tmStart" onclick="tmStartPause()" title="Start">▶️</button>
      </div>
      <div id="tmFinished" class="hidden" style="font-size:2rem;animation:pulse 1s ease infinite">🎉 Time's Up!</div>
      @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    </div>
  </div>

  <script>
    // ═════════════════ STOPWATCH ═════════════════
    let swMs = 0, swStart = null, swRunning = false, swRaf = null;
    let laps = [], lastLapMs = 0;

    function swTick() {
      swMs = Date.now() - swStart;
      renderSwDisplay();
      swRaf = requestAnimationFrame(swTick);
    }

    function swStartPause() {
      if (!swRunning) {
        swStart = Date.now() - swMs;
        swRunning = true;
        swRaf = requestAnimationFrame(swTick);
        document.getElementById('swStart').className = 'ctrl-btn pause';
        document.getElementById('swStart').textContent = '⏸️';
        document.getElementById('swLap').disabled = false;
        document.getElementById('swRing').classList.add('active');
      } else {
        cancelAnimationFrame(swRaf);
        swRunning = false;
        document.getElementById('swStart').className = 'ctrl-btn start';
        document.getElementById('swStart').textContent = '▶️';
        document.getElementById('swRing').classList.remove('active');
      }
    }

    function swReset() {
      cancelAnimationFrame(swRaf);
      swRunning = false; swMs = 0; laps = []; lastLapMs = 0;
      document.getElementById('swStart').className = 'ctrl-btn start';
      document.getElementById('swStart').textContent = '▶️';
      document.getElementById('swLap').disabled = true;
      document.getElementById('swRing').classList.remove('active');
      renderSwDisplay();
      renderLaps();
    }

    function swLap() {
      const diff = swMs - lastLapMs;
      laps.push({ total: swMs, diff });
      lastLapMs = swMs;
      renderLaps();
    }

    function renderSwDisplay() {
      document.getElementById('swDisplay').innerHTML = fmtMs(swMs) + `<span class="time-ms">.${String(Math.floor(swMs/10)%100).padStart(2,'0')}</span>`;
      const secs = (swMs / 1000) % 60;
      document.getElementById('swRing').style.setProperty('--prog', (secs/60*100).toFixed(1)+'%');
    }

    function renderLaps() {
      const el = document.getElementById('lapsList');
      if (!laps.length) { el.innerHTML = ''; return; }
      const bestDiff  = Math.min(...laps.map(l=>l.diff));
      const worstDiff = Math.max(...laps.map(l=>l.diff));
      el.innerHTML = [...laps].reverse().map((lap, ri) => {
        const i = laps.length - ri;
        const cls = laps.length > 1 ? (lap.diff === bestDiff ? 'lap-best' : lap.diff === worstDiff ? 'lap-worst' : '') : '';
        return `<div class="lap-item">
          <span class="lap-num">Lap ${i}</span>
          <span class="lap-time">${fmtMs(lap.total)}.${String(Math.floor(lap.total/10)%100).padStart(2,'0')}</span>
          <span class="lap-diff ${cls}">+${fmtMs(lap.diff)}</span>
        </div>`;
      }).join('');
    }

    // ═════════════════ TIMER ═════════════════════
    let tmMs = 0, tmTotal = 0, tmStart = null, tmRunning = false, tmRaf = null;

    function tmStartPause() {
      if (!tmRunning) {
        if (!tmMs) {
          const h = parseInt(document.getElementById('tmH').value)||0;
          const m = parseInt(document.getElementById('tmM').value)||0;
          const s = parseInt(document.getElementById('tmS').value)||0;
          tmTotal = (h*3600 + m*60 + s) * 1000;
          tmMs = tmTotal;
          if (!tmMs) return;
        }
        tmStart = Date.now() - (tmTotal - tmMs);
        tmRunning = true;
        document.getElementById('timerInputs').classList.add('hidden');
        document.getElementById('tmDisplay').style.display = '';
        document.getElementById('timerProgressWrap').classList.remove('hidden');
        document.getElementById('tmStart').className = 'ctrl-btn pause';
        document.getElementById('tmStart').textContent = '⏸️';
        document.getElementById('tmRing').classList.add('active');
        tmRaf = requestAnimationFrame(tmTick);
      } else {
        cancelAnimationFrame(tmRaf);
        tmRunning = false;
        document.getElementById('tmStart').className = 'ctrl-btn start';
        document.getElementById('tmStart').textContent = '▶️';
        document.getElementById('tmRing').classList.remove('active');
      }
    }

    function tmTick() {
      const elapsed = Date.now() - tmStart;
      tmMs = Math.max(0, tmTotal - elapsed);
      renderTmDisplay();
      if (tmMs <= 0) { tmFinished(); return; }
      tmRaf = requestAnimationFrame(tmTick);
    }

    function tmFinished() {
      cancelAnimationFrame(tmRaf); tmRunning = false;
      document.getElementById('tmDisplay').style.display = 'none';
      document.getElementById('tmFinished').classList.remove('hidden');
      document.getElementById('tmStart').disabled = true;
      document.getElementById('tmRing').classList.remove('active');
      // Beep
      try {
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
        osc.start(); osc.stop(ctx.currentTime + 1.5);
      } catch(e) {}
    }

    function tmReset() {
      cancelAnimationFrame(tmRaf); tmRunning = false; tmMs = 0; tmTotal = 0;
      document.getElementById('timerInputs').classList.remove('hidden');
      document.getElementById('tmDisplay').style.display = 'none';
      document.getElementById('timerProgressWrap').classList.add('hidden');
      document.getElementById('tmFinished').classList.add('hidden');
      document.getElementById('tmStart').disabled = false;
      document.getElementById('tmStart').className = 'ctrl-btn start';
      document.getElementById('tmStart').textContent = '▶️';
      document.getElementById('tmRing').classList.remove('active');
    }

    function renderTmDisplay() {
      document.getElementById('tmDisplay').innerHTML = fmtMs(tmMs) + `<span class="time-ms">.${String(Math.floor(tmMs/10)%100).padStart(2,'0')}</span>`;
      const pct = tmTotal > 0 ? (tmMs/tmTotal)*100 : 0;
      document.getElementById('timerProgFill').style.width = pct + '%';
      document.getElementById('timerProgFill').style.background = pct < 20
        ? 'linear-gradient(90deg,#ef4444,#f97316)'
        : 'linear-gradient(90deg,var(--green),var(--cyan))';
      document.getElementById('tmRing').style.setProperty('--prog', pct.toFixed(1)+'%');
    }

    // ═════════════════ MODE ══════════════════════
    function setMode(mode) {
      document.getElementById('tabSW').classList.toggle('active', mode==='stopwatch');
      document.getElementById('tabTM').classList.toggle('active', mode==='timer');
      document.getElementById('stopwatchPanel').classList.toggle('hidden', mode!=='stopwatch');
      document.getElementById('timerPanel').classList.toggle('hidden', mode!=='timer');
    }

    // ═════════════════ UTILS ═════════════════════
    function fmtMs(ms) {
      const totalSec = Math.floor(ms/1000);
      const h = Math.floor(totalSec/3600);
      const m = Math.floor((totalSec%3600)/60);
      const s = totalSec%60;
      if (h>0) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
  </script>
</body>
</html>
